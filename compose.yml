services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${PORT}:8000
    volumes:
      - .env:/app/.env
      - ./app:/app/app
    environment:
      - LOG_LEVEL=${LOG_LEVEL}

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
